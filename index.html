<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>تحديث التطبيق</title>
<meta name="theme-color" content="#efe9df">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;outline:0}
::selection{background:#7d6b52;color:#fff}
html{background-color:#efe9df!important;overflow-x:hidden;scroll-behavior:smooth}
body{font-family:'Tajawal',system-ui,sans-serif;background-color:#efe9df;margin:0;padding:16px;display:flex;justify-content:center;align-items:center;min-height:100vh;-webkit-user-select:none;user-select:none}
.card{background:#fff;border:1px solid #e4ddd4;border-radius:32px;padding:35px 25px 25px;width:100%;max-width:360px;box-shadow:0 15px 35px rgba(125,107,82,.08);position:relative;z-index:10}
.lang-toggle{position:absolute;top:20px;left:20px;background:#fff;border:1px solid #f0ece4;color:#1d1b20;padding:8px 16px;border-radius:30px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.04);transition:transform .2s;direction:ltr;z-index:20}
.lang-toggle:active{transform:scale(.95)}
#globeIcon{color:#7d6b52;transition:transform .6s ease}
.u-title-clean{font-size:19px;font-weight:800;color:#1d1b20;margin-bottom:4px;letter-spacing:-.5px}
.u-sub-clean{font-size:11.5px;color:#7d6b52;font-weight:600;line-height:1.5}
.update-box-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;padding:0 5px;margin-top:35px}
.update-txt-area{flex:1;text-align:start}
.brand-badge{width:64px;height:64px;background:#fff;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;flex-shrink:0;margin-inline-end:18px;border:1px solid rgba(184,147,90,.15);box-shadow:0 4px 10px rgba(184,147,90,.1),0 0 0 0 rgba(184,147,90,.2);animation:elitePulse 3s infinite}
@keyframes elitePulse{0%,100%{transform:translateY(0) scale(1);box-shadow:0 4px 10px rgba(184,147,90,.1),0 0 0 0 rgba(184,147,90,.2)}50%{transform:translateY(-3px) scale(1.02);box-shadow:0 8px 15px rgba(184,147,90,.15),0 0 0 8px rgba(184,147,90,0)}}
.brand-badge img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.modern-tracker-container{position:relative;width:140px;height:140px;margin:0 auto 15px;display:flex;justify-content:center;align-items:center}
.radar-rings-pro{position:absolute;width:100%;height:100%;border-radius:50%;pointer-events:none;display:block;z-index:1;opacity:.5;transition:opacity .4s ease}
.radar-rings-pro.active{opacity:1}
.radar-rings-pro::after,.radar-rings-pro::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(184,147,90,.3);animation:radarRipplePro 3s cubic-bezier(.25,1,.5,1) infinite;opacity:0}
.radar-rings-pro::after{animation-delay:1.5s}
.radar-rings-pro.active::after,.radar-rings-pro.active::before{border-color:rgba(184,147,90,.6);animation-duration:1.8s}
@keyframes radarRipplePro{0%{width:100px;height:100px;opacity:1;border-width:2px}100%{width:220px;height:220px;opacity:0;border-width:0}}
.idle-scanner{position:absolute;top:0;left:0;width:140px;height:140px;z-index:3;animation:scanSpin 3s cubic-bezier(.4,0,.2,1) infinite;transition:opacity .4s ease;pointer-events:none}
.idle-scanner::after{content:'';position:absolute;top:4px;left:50%;transform:translateX(-50%);width:8px;height:8px;background:#ffe066;border-radius:50%;box-shadow:0 0 12px #ffe066,0 0 20px #b8935a}
@keyframes scanSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.download-active .idle-scanner,.tracker-installing .idle-scanner,.tracker-success .idle-scanner{opacity:0;animation:none}
.progress-ring{transform:rotate(-90deg);position:absolute;top:0;left:0;z-index:2}
.progress-ring__track{stroke:rgba(184,147,90,.12);stroke-width:5;fill:transparent;stroke-dasharray:4 6}
.progress-ring__circle{stroke:url(#goldGradient);stroke-width:5;fill:transparent;stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;transition:stroke-dashoffset .4s cubic-bezier(.4,0,.2,1),stroke .4s ease}
.tracker-glow{position:absolute;width:115px;height:115px;border-radius:50%;background:radial-gradient(circle,rgba(184,147,90,.18) 0,transparent 70%);z-index:0;animation:gentlePulse 3s ease-in-out infinite alternate}
@keyframes gentlePulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.15);opacity:1}}
.tracker-content{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;width:110px;height:110px;border-radius:50%;transition:background-color .4s ease;box-shadow:0 4px 20px rgba(184,147,90,.15),inset 0 0 15px rgba(184,147,90,.05);animation:breatheTrackerCenter 3.5s ease-in-out infinite alternate}
@keyframes breatheTrackerCenter{0%{transform:scale(1);box-shadow:0 4px 20px rgba(184,147,90,.12),inset 0 0 10px rgba(184,147,90,.02)}100%{transform:scale(1.02);box-shadow:0 8px 25px rgba(184,147,90,.25),inset 0 0 20px rgba(184,147,90,.08)}}
.tracker-label{font-size:10px;color:#b0a898;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;transition:opacity .3s}
.tracker-value{font-family:'Montserrat',sans-serif;font-size:28px;font-weight:800;line-height:1;direction:ltr;background:linear-gradient(to right,#1d1b20 0,#a69477 50%,#1d1b20 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:textShinePro 4s linear infinite}
@keyframes textShinePro{0%{background-position:200% center}100%{background-position:0 center}}
.tracker-installing .progress-ring__circle{stroke:url(#goldGradient);animation:breatheRingGold 2s infinite alternate}
@keyframes breatheRingGold{0%{filter:drop-shadow(0 0 2px rgba(184,147,90,.3))}100%{filter:drop-shadow(0 0 12px rgba(184,147,90,.8))}}
.tracker-installing .tracker-glow{background:radial-gradient(circle,rgba(184,147,90,.25) 0,transparent 70%)}
.tracker-success .progress-ring__circle{stroke:#10b981;animation:none}
.tracker-success .tracker-glow{background:radial-gradient(circle,rgba(16,185,129,.2) 0,transparent 70%)}
.install-state-ui{display:none;flex-direction:column;align-items:center;justify-content:center;animation:fadeInScale .5s cubic-bezier(.25,1,.5,1) forwards;width:100%;height:100%}
@keyframes fadeInScale{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
.gears-wrapper{position:relative;width:38px;height:38px;display:flex;justify-content:center;align-items:center;margin-bottom:4px}
.gear-large{font-size:24px;color:#b8935a;animation:spinRight 3.5s linear infinite;position:absolute;top:0;left:2px;filter:drop-shadow(0 2px 4px rgba(184,147,90,.4))}
.gear-small{font-size:14px;color:#7d6b52;animation:spinLeft 2.5s linear infinite;position:absolute;bottom:2px;right:2px}
@keyframes spinRight{100%{transform:rotate(360deg)}}@keyframes spinLeft{100%{transform:rotate(-360deg)}}
.install-state-text{font-size:10px;font-weight:800;color:#b8935a;letter-spacing:.5px;animation:pulseText 2s infinite alternate}
@keyframes pulseText{0%{opacity:.6}100%{opacity:1}}
.changelog-container{background:#fff;border:1px solid #f0ece4;border-radius:16px;padding:14px;margin-bottom:20px;text-align:start;box-shadow:0 4px 15px rgba(0,0,0,.02)}
.changelog-title{font-size:11px;font-weight:800;color:#1d1b20;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.changelog-title i{color:#b8935a;font-size:13px;animation:spinSlow 6s linear infinite}
@keyframes spinSlow{100%{transform:rotate(360deg)}}
.changelog-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.changelog-list li{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:#4a453f;font-weight:600;line-height:1.5;opacity:0;transform:translateX(10px);animation:slideInRight .6s cubic-bezier(.2,1,.3,1) forwards}
.changelog-list li i{color:#b8935a;font-size:12px;margin-top:2px}
@keyframes slideInRight{to{opacity:1;transform:translateX(0)}}
.btn-update-modern{position:relative;background:linear-gradient(135deg,#1d1b20 0,#2f2a24 50%,#1d1b20 100%);background-size:200% auto;color:#fff;border-radius:16px;font-weight:700;height:50px;border:1px solid rgba(184,147,90,.5);animation:bgShift 8s linear infinite,floatButtonGold 2.8s ease-in-out infinite;transition:all .4s cubic-bezier(.4,0,.2,1);overflow:hidden;margin-bottom:0;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;z-index:1;cursor:pointer;font-family:inherit;font-size:15px}
.btn-update-modern::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;background:linear-gradient(to right,transparent,rgba(184,147,90,.6),transparent);transform:skewX(-25deg);animation:shimmerSweepContinuous 4s linear infinite;z-index:-1}
.btn-update-modern:hover{border-color:rgba(184,147,90,.9)}
.btn-update-modern:active{transform:translateY(0) scale(.96);animation:none}
@keyframes bgShift{0%{background-position:0 center}100%{background-position:200% center}}
@keyframes floatButtonGold{0%,100%{transform:translateY(0);box-shadow:0 4px 15px rgba(29,27,32,.2)}50%{transform:translateY(-3.5px);box-shadow:0 12px 28px rgba(184,147,90,.45)}}
@keyframes shimmerSweepContinuous{0%{left:-120%}100%{left:220%}}
.btn-install-modern{background:linear-gradient(135deg,#10b981,#059669)!important;border-color:transparent!important;box-shadow:0 6px 15px rgba(16,185,129,.3)!important;animation:floatButtonGold 2.5s ease-in-out infinite!important}
.btn-install-modern::after{display:none}
.btn-hidden{opacity:0!important;pointer-events:none!important;height:0!important;padding:0!important;margin:0!important;overflow:hidden!important;border:0!important}
.manual-dl-wrap{text-align:center;margin-top:24px;font-size:10px;font-weight:600;color:#a19888;transition:all .3s ease}
.manual-dl-link{display:inline-flex;align-items:center;font-weight:800;color:#b8935a;cursor:pointer;text-decoration:none;transition:all .2s}
.manual-dl-link:hover{color:#7d6b52}
.manual-dl-link:active{transform:scale(.96)}
</style>
</head>
<body>
<div class="card">
<button class="lang-toggle" onclick="toggleLang()"><i class="fas fa-globe" id="globeIcon"></i> <span id="langText" style="margin-top: 2px;">English</span></button>
<div class="update-box-wrap">
<div class="brand-badge"><img src="https://cdn.jsdelivr.net/gh/twaiq1o/Updates@main/twaiq.PNG" decoding="async"></div>
<div class="update-txt-area">
<h3 class="u-title-clean" id="uTitle">تحديث جديد متوفر</h3>
<p class="u-sub-clean" id="uSub">لضمان أفضل أداء يرجى التحديث</p>
</div>
</div>
<div class="modern-tracker-container" id="trackerContainer">
<div class="tracker-glow"></div>
<div class="radar-rings-pro" id="radarPro"></div>
<div class="idle-scanner" id="idleScanner"></div>
<svg class="progress-ring" width="140" height="140">
<defs>
<linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#b8935a" />
<stop offset="100%" stop-color="#e0c897" />
</linearGradient>
</defs>
<circle class="progress-ring__track" r="60" cx="70" cy="70"/>
<circle class="progress-ring__circle" id="progressRingCircle" r="60" cx="70" cy="70"/>
</svg>
<div class="tracker-content">
<div class="tracker-label" id="trackerLabelUI">الإصدار</div>
<div class="tracker-value" id="trackerValueUI">--</div>
<div class="install-state-ui" id="installStateUI">
<div class="gears-wrapper" id="gearsUI">
<i class="fas fa-cog gear-large"></i> <i class="fas fa-cog gear-small"></i>
</div>
<span class="install-state-text" id="installStateText">جاري التجهيز...</span>
</div>
</div>
</div>
<div class="changelog-container">
<div class="changelog-title"><i class="fas fa-bolt"></i> <span id="uWhatsNew">أبرز التحسينات</span></div>
<ul id="changelogList" class="changelog-list"></ul>
</div>
<button class="btn-update-modern" id="updateActionBtn" onclick="startUpdateProcess()">
<i class="fas fa-cloud-download-alt" id="uBtnDlIcon" style="font-size: 15px; animation: floatingIcon 3s infinite;"></i> 
<span id="uBtnDlText">تحديث الآن</span>
</button>
<div class="manual-dl-wrap" id="manualDownloadWrap">
<span id="manualDlPrefixText">في حال تعذر التحديث التلقائي،</span> 
<span class="manual-dl-link" onclick="manualDownloadLink()">
<span id="manualDlLinkText">انقر هنا للتحميل اليدوي</span> <i class="fas fa-external-link-square-alt" style="margin-inline-start: 5px;"></i>
</span>
</div>
</div>
<script>
const CONFIG = {
    requiredVersion: 13.8,
    downloadLink: "https://github.com/twaiq1o/Updates/releases/download/Latest/v13.8.apk",
    whatsNew: {
        ar: [
            "إضافة نظام دردشة جماعية متكامل يتيح التواصل الفوري",
            "دعم ميزة النقاط الحرارية داخل خريطة تغيير الموقع",
            "تخصيص مركز إشعارات متكامل لمتابعة المستجدات",
            "تحسينات تقنية لرفع سرعة استجابة النظام"
        ],
        en: [
            "Addition of an integrated group chat system",
            "Heatmap support integrated into the map",
            "A dedicated Notification Center",
            "Enhancements to boost system speed"
        ]
    }
};
let currentLang = 'ar';
let updateState = 0;
const texts = {
    ar: { dir: 'rtl', langT: 'English', uTitle: 'تحديث جديد متوفر', uSub: 'لضمان أفضل أداء يرجى التحديث', uWhatsNew: 'أبرز التحسينات', uVerLabel: 'الإصدار', uProgLabel: 'تحميل', uBtnDl: 'تحديث الآن', uInst: 'تثبيت الآن', uInstState: 'جاري التجهيز...', uInstReady: 'جاهز للتثبيت', uManDlPrefix: 'هل تواجه مشكلة؟', uManDlLink: 'حمل يدوياً' },
    en: { dir: 'ltr', langT: 'العربية', uTitle: 'New Update Available', uSub: 'Please update for best performance', uWhatsNew: 'Key Improvements', uVerLabel: 'Version', uProgLabel: 'Downloading', uBtnDl: 'Update Now', uInst: 'Install Now', uInstState: 'Processing...', uInstReady: 'Ready to Install', uManDlPrefix: 'Having issues?', uManDlLink: 'Download manually' }
};
function updateUI() {
    const t = texts[currentLang];
    document.documentElement.lang = currentLang;
    document.documentElement.dir = t.dir;
    document.getElementById('langText').innerText = t.langT;
    document.getElementById('uTitle').innerText = t.uTitle;
    document.getElementById('uSub').innerText = t.uSub;
    document.getElementById('uWhatsNew').innerText = t.uWhatsNew;
    document.getElementById('manualDlPrefixText').innerText = t.uManDlPrefix;
    document.getElementById('manualDlLinkText').innerText = t.uManDlLink;
    if (updateState === 0) {
        document.getElementById('uBtnDlText').innerText = t.uBtnDl;
        document.getElementById('trackerLabelUI').innerText = t.uVerLabel;
    } else if (updateState === 1) {
        document.getElementById('trackerLabelUI').innerText = t.uProgLabel;
    } else if (updateState === 2) {
        document.getElementById('uBtnDlText').innerText = t.uInst;
    }
    const clList = document.getElementById('changelogList');
    clList.innerHTML = '';
    CONFIG.whatsNew[currentLang].forEach((txt, i) => {
        let li = document.createElement('li');
        li.style.animationDelay = (0.1 + (i * 0.1)) + 's';
        li.innerHTML = `<i class="fas fa-check-circle"></i> <span>${txt}</span>`;
        clList.appendChild(li);
    });
}
function toggleLang() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    let g = document.getElementById('globeIcon');
    g.style.transform = g.style.transform === 'rotate(360deg)' ? 'rotate(0deg)' : 'rotate(360deg)';
    updateUI();
}
window.onload = () => {
    document.getElementById('trackerValueUI').innerText = CONFIG.requiredVersion.toFixed(1);
    updateUI();
};
function manualDownloadLink() {
    window.location.href = CONFIG.downloadLink;
}
function executeInstall() {
    const apkFileName = "v" + CONFIG.requiredVersion.toFixed(1) + ".apk";
    try {
        if (typeof AP !== "undefined") {
            let success = AP.installApk(apkFileName);
            if (!success) window.location.href = CONFIG.downloadLink;
        } else {
            window.location.href = CONFIG.downloadLink;
        }
    } catch (e) {
        window.location.href = CONFIG.downloadLink;
    }
}
function startUpdateProcess() {
    if (updateState === 1) return;
    if (updateState === 2) {
        executeInstall();
        return;
    }
    updateState = 1;
    const btn = document.getElementById('updateActionBtn');
    const manualWrap = document.getElementById('manualDownloadWrap');
    const circle = document.getElementById('progressRingCircle');
    const trackerValUI = document.getElementById('trackerValueUI');
    const trackerLabelUI = document.getElementById('trackerLabelUI');
    const radar = document.getElementById('radarPro');
    const trackerContainer = document.getElementById('trackerContainer');
    radar.classList.add('active');
    trackerContainer.classList.add('download-active');
    btn.classList.add('btn-hidden');
    if(manualWrap) manualWrap.classList.add('btn-hidden');
    trackerLabelUI.innerText = texts[currentLang].uProgLabel;
    trackerValUI.innerText = "0%";
    const circumference = 377;
    try {
        let dlTitle = currentLang === 'ar' ? "تحديث " + CONFIG.requiredVersion.toFixed(1) : "Update " + CONFIG.requiredVersion.toFixed(1);
        let dlDesc = currentLang === 'ar' ? "جاري التحميل..." : "Downloading...";
        const apkFileName = "v" + CONFIG.requiredVersion.toFixed(1) + ".apk";
        if (typeof AP !== "undefined") {
            AP.startRealDownload(CONFIG.downloadLink, dlTitle, dlDesc, apkFileName);
        } else {
            window.location.href = CONFIG.downloadLink;
            return;
        }
        let checkProgress = setInterval(() => {
            let prog = AP.getDownloadProgress();
            if (prog >= 100) {
                clearInterval(checkProgress);
                radar.classList.remove('active');
                circle.style.strokeDashoffset = 0;
                trackerValUI.innerText = "100%";
                setTimeout(() => {
                    trackerContainer.classList.add('tracker-installing');
                    trackerContainer.classList.remove('download-active');
                    trackerValUI.style.display = 'none';
                    trackerLabelUI.style.display = 'none';
                    document.getElementById('installStateUI').style.display = 'flex';
                    document.getElementById('installStateText').innerText = texts[currentLang].uInstState;
                    setTimeout(() => {
                        updateState = 2;
                        trackerContainer.classList.remove('tracker-installing');
                        trackerContainer.classList.add('tracker-success');
                        document.getElementById('installStateUI').innerHTML = `<i class="fas fa-check-circle" style="font-size: 32px; color: #10b981; margin-bottom: 8px;"></i><span class="install-state-text" style="color: #10b981; animation: none;">${texts[currentLang].uInstReady}</span>`;
                        btn.classList.remove('btn-hidden');
                        btn.classList.add('btn-install-modern');
                        document.getElementById('uBtnDlIcon').className = 'fas fa-box-open';
                        document.getElementById('uBtnDlIcon').style.animation = 'none';
                        document.getElementById('uBtnDlText').innerText = texts[currentLang].uInst;
                        executeInstall();
                    }, 2000);
                }, 500);
            } else if (prog < 0) {
                clearInterval(checkProgress);
                updateState = 0;
                trackerContainer.classList.remove('download-active');
                radar.classList.remove('active');
                window.location.href = CONFIG.downloadLink;
            } else {
                const offset = circumference - (prog / 100) * circumference;
                circle.style.strokeDashoffset = offset;
                trackerValUI.innerText = Math.floor(prog) + '%';
            }
        }, 400);
    } catch (e) {
        window.location.href = CONFIG.downloadLink;
    }
}
</script>
</body>
</html>

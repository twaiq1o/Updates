<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دردشة طويق</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: transparent; 
            display: flex; justify-content: center; align-items: center; 
            padding: 16px; margin: 0;
            transition: padding 0.3s ease;
        }

        .chat-card {
            background: #fff; border: 1px solid #e4ddd4; border-radius: 32px;
            width: 100%; max-width: 360px; height: 550px;
            display: flex; flex-direction: column;
            box-shadow: 0 15px 35px rgba(125,107,82,.15);
            overflow: hidden; position: relative;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .chat-header {
            background: #fff; padding: 20px; border-bottom: 1px solid #f0ece4;
            display: flex; align-items: center; gap: 12px; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); position: relative; flex-shrink: 0;
            transition: padding 0.3s ease;
        }

        .chat-header i.fa-comments { color: #b8935a; font-size: 24px; transition: font-size 0.3s; }
        .chat-header h2 { font-size: 18px; color: #1d1b20; font-weight: 800; margin-bottom: 2px; transition: font-size 0.3s;}
        .chat-header p { font-size: 11px; color: #7d6b52; font-weight: 600; transition: opacity 0.2s;}

        .close-btn {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            background: #faf9f7; border: 1px solid #f0ece4; color: #1d1b20;
            width: 32px; height: 32px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s;
        }
        
        html[dir="ltr"] .close-btn { left: auto; right: 20px; }
        .close-btn:active { transform: translateY(-50%) scale(0.9); }
        .close-btn i { font-size: 14px; }

        .chat-messages {
            flex-grow: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            background-color: #faf9f7;
            transition: padding 0.3s ease;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #e4ddd4; border-radius: 10px; }

        .message {
            max-width: 85%; display: flex; flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message .sender-name {
            font-size: 10px; font-weight: 700; color: #a59b8d; margin-bottom: 4px;
        }

        .message .text {
            padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5;
            word-wrap: break-word; font-weight: 500;
        }

        .message.mine { align-self: flex-start; }
        .message.mine .text { background: #b8935a; color: #fff; border-bottom-right-radius: 4px; }
        .message.mine .sender-name { text-align: right; color: #b8935a; }

        .message.others { align-self: flex-end; }
        .message.others .text { background: #fff; color: #1d1b20; border: 1px solid #f0ece4; border-bottom-left-radius: 4px; }
        .message.others .sender-name { text-align: left; }

        .chat-input-area {
            background: #fff; padding: 15px; border-top: 1px solid #f0ece4;
            display: flex; flex-direction: column; gap: 10px; flex-shrink: 0;
            transition: padding 0.3s ease;
        }

        .username-container {
            display: flex; gap: 8px; width: 100%;
        }

        .username-input {
            flex-grow: 1; padding: 10px 15px; border: 1px solid #e4ddd4;
            border-radius: 12px; font-size: 12px; font-weight: 700; color: #1d1b20;
            background: #faf9f7; transition: all 0.3s;
        }
        .username-input:focus { border-color: #b8935a; outline: none; }
        .username-input:disabled { background: #f0ece4; color: #a59b8d; cursor: not-allowed; }

        .edit-name-btn {
            background: #faf9f7; color: #7d6b52; border: 1px solid #e4ddd4; border-radius: 12px;
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .edit-name-btn:active { transform: scale(0.9); }

        .message-box { display: flex; gap: 8px; }
        
        .msg-input {
            flex-grow: 1; padding: 12px 15px; border: 1px solid #e4ddd4;
            border-radius: 16px; font-size: 13px; background: #faf9f7;
            transition: all 0.3s; font-weight: 500;
        }
        .msg-input:focus { border-color: #b8935a; outline: none; background: #fff; }

        .send-btn {
            background: #1d1b20; color: #fff; border: none; border-radius: 16px;
            width: 44px; height: 44px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .send-btn:hover { background: #b8935a; transform: translateY(-2px); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn i { font-size: 16px; margin-right: 2px; }

        .toast-msg {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(29, 27, 32, 0.9); color: #fff; padding: 10px 16px;
            border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 1000;
        }
        .toast-msg.show { opacity: 1; }

        /* --- الحل الذكي: وضع "مضغوط" يعمل تلقائياً عند فتح الكيبورد --- */
        @media screen and (max-height: 520px) {
            body { padding: 4px; }
            .chat-card { 
                height: 100vh; max-height: 100vh; 
                border-radius: 20px; 
            }
            .chat-header { padding: 8px 15px; }
            .chat-header h2 { font-size: 15px; margin-bottom: 0; }
            .chat-header p { display: none; } /* إخفاء النص الفرعي مؤقتاً */
            .chat-header i.fa-comments { font-size: 20px; }
            .close-btn { width: 28px; height: 28px; }
            
            .chat-input-area { padding: 8px 12px; gap: 6px; }
            .username-input, .msg-input { padding: 8px 12px; font-size: 12px; }
            .edit-name-btn, .send-btn { width: 36px; height: 36px; border-radius: 12px; }
            .send-btn i { font-size: 14px; }
            
            .chat-messages { padding: 10px 15px; gap: 10px; }
        }

    </style>
</head>
<body>

    <div class="chat-card">
        <div class="chat-header">
            <div class="close-btn" id="closeChatBtn"><i class="fas fa-times"></i></div>
            <i class="fas fa-comments"></i>
            <div>
                <h2>محادثة طويق</h2>
                <p>محادثة جماعية مباشرة</p>
            </div>
        </div>

        <div class="chat-messages" id="chatBox"></div>

        <div class="chat-input-area">
            <div class="username-container">
                <input type="text" id="userName" class="username-input" placeholder="اكتب اسمك المستعار هنا..." maxlength="20">
                <button class="edit-name-btn" id="editNameBtn"><i class="fas fa-pen"></i></button>
            </div>
            <div class="message-box">
                <input type="text" id="msgText" class="msg-input" placeholder="اكتب رسالتك..." autocomplete="off">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        
        <div id="toastMsg" class="toast-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, serverTimestamp, goOffline, goOnline, onValue } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlSb2RsFDei6KFh2VvrKyM-ydDrhxV3aE",
            authDomain: "twaiqchat.firebaseapp.com",
            databaseURL: "https://twaiqchat-default-rtdb.firebaseio.com",
            projectId: "twaiqchat",
            storageBucket: "twaiqchat.firebasestorage.app",
            messagingSenderId: "377499668649",
            appId: "1:377499668649:web:6aed4ccacd1b3c7dcc99b8",
            measurementId: "G-5MYK8MHNGR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, 'global_messages');

        const chatBox = document.getElementById('chatBox');
        const userNameInput = document.getElementById('userName');
        const msgTextInput = document.getElementById('msgText');
        const sendBtn = document.getElementById('sendBtn');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const editNameBtn = document.getElementById('editNameBtn');
        const toastMsg = document.getElementById('toastMsg');

        let serverOffset = 0;
        const offsetRef = ref(db, ".info/serverTimeOffset");
        onValue(offsetRef, (snap) => {
            serverOffset = snap.val() || 0;
        });

        function getTrueServerTime() {
            return Date.now() + serverOffset;
        }

        function showToast(text) {
            toastMsg.innerText = text;
            toastMsg.classList.add('show');
            setTimeout(() => { toastMsg.classList.remove('show'); }, 3000);
        }

        function killConnection() {
            try { goOffline(db); } catch(e) {}
        }

        function restoreConnection() {
            try { goOnline(db); } catch(e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') killConnection();
            else restoreConnection();
        });

        window.addEventListener('pagehide', killConnection);
        window.addEventListener('unload', killConnection);

        closeChatBtn.addEventListener('click', function() {
            killConnection();
            window.location.href = "ninja://close";
        });

        const savedName = localStorage.getItem('twaiqChatName');
        if (savedName) {
            userNameInput.value = savedName;
            userNameInput.disabled = true; 
        }

        const COOLDOWN_MS = 30 * 60 * 1000; 

        editNameBtn.addEventListener('click', () => {
            if (!userNameInput.disabled) {
                userNameInput.focus();
                return;
            }
            
            const lastEdit = parseInt(localStorage.getItem('twaiqNameLastEdit') || '0', 10);
            const now = getTrueServerTime();
            const diff = now - lastEdit;
            
            if (diff < COOLDOWN_MS && lastEdit !== 0) {
                const remainingMins = Math.ceil((COOLDOWN_MS - diff) / 60000);
                showToast(`يرجى الانتظار ${remainingMins} دقيقة لتعديل الاسم مجدداً.`);
            } else {
                userNameInput.disabled = false;
                userNameInput.focus();
            }
        });

        function sendMessage() {
            const name = userNameInput.value.trim() || 'ضيف';
            const text = msgTextInput.value.trim();

            if (text === '') return;

            if (!userNameInput.disabled) {
                localStorage.setItem('twaiqChatName', name);
                localStorage.setItem('twaiqNameLastEdit', getTrueServerTime().toString());
                userNameInput.disabled = true;
            }

            push(chatRef, {
                sender: name,
                text: text,
                timestamp: serverTimestamp()
            });

            msgTextInput.value = '';
            msgTextInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);

        msgTextInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const currentName = userNameInput.value.trim() || 'ضيف';
            const savedLocalName = localStorage.getItem('twaiqChatName') || currentName;
            
            const isMine = data.sender === savedLocalName;

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMine ? 'mine' : 'others'}`;
            
            msgDiv.innerHTML = `
                <div class="sender-name">${escapeHTML(data.sender)}</div>
                <div class="text">${escapeHTML(data.text)}</div>
            `;

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
            
        msgTextInput.addEventListener('focus', () => {
            setTimeout(() => {
                msgTextInput.scrollIntoView({ behavior: 'smooth', block: 'end' });
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 300);
        });
    </script>
</body>
</html>

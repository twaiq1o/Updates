<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دردشة جماعية</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        
        input, textarea, .message .text, .actual-content { -webkit-user-select: text; user-select: text; }

        body { 
            font-family: 'Tajawal', system-ui, sans-serif; 
            background-color: transparent !important; 
            padding: 16px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

            
        


        .chat-card {
            
            position: relative;
            background: #fff; border: 1px solid #e4ddd4; border-radius: 32px; 
            padding: 65px 25px 25px; 
            width: 100%; max-width: 360px; 
            height: 650px; 
            max-height: calc(var(--vh, 100vh) - 1px);
            margin: 0 auto; 
            box-shadow: 0 15px 35px rgba(125,107,82,.15);
            display: flex; flex-direction: column; 
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
            
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .loader-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #faf9f7; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .spinner {
            width: 45px; height: 45px; border: 4px solid #e4ddd4;
            border-top-color: #b8935a; border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loader-text { font-size: 14px; font-weight: 700; color: #7d6b52; }

        .chat-header {
            background: #fff; padding: 20px; border-bottom: 1px solid #f0ece4;
            display: flex; align-items: center; gap: 12px; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); position: relative; 
            flex-shrink: 0; min-height: 80px; 
        }

        .chat-header i.fa-comments { color: #b8935a; font-size: 24px; }
        .chat-header h2 { font-size: 18px; color: #1d1b20; font-weight: 800; margin-bottom: 2px;}
        .chat-header p { font-size: 11px; color: #7d6b52; font-weight: 600;}

        .close-btn {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            background: #faf9f7; border: 1px solid #f0ece4; color: #1d1b20;
            width: 32px; height: 32px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s;
        }
        
        html[dir="ltr"] .close-btn { left: auto; right: 20px; }
        .close-btn:active { transform: translateY(-50%) scale(0.9); }
        .close-btn i { font-size: 14px; }

        .chat-messages {
            flex-grow: 1; padding: 20px; overflow-y: auto; overflow-x: hidden;
            display: flex; flex-direction: column; gap: 15px;
            background-color: #faf9f7;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #e4ddd4; border-radius: 10px; }

        .message {
            max-width: 85%; display: flex; flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message .sender-name {
            font-size: 10px; font-weight: 700; color: #a59b8d; margin-bottom: 4px;
        }

        .message .text {
            padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5;
            font-weight: 500; position: relative; min-width: 70px;
            will-change: transform;
        }

        .message.mine { align-self: flex-start; }
        .message.mine .text { background: #b8935a; color: #fff; border-bottom-right-radius: 4px; }
        html[dir="ltr"] .message.mine .text { border-bottom-right-radius: 16px; border-bottom-left-radius: 4px; }
        .message.mine .sender-name { text-align: right; color: #b8935a; }
        html[dir="ltr"] .message.mine .sender-name { text-align: left; }

        .message.others { align-self: flex-end; }
        .message.others .text { background: #fff; color: #1d1b20; border: 1px solid #f0ece4; border-bottom-left-radius: 4px; }
        html[dir="ltr"] .message.others .text { border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
        .message.others .sender-name { text-align: left; }
        html[dir="ltr"] .message.others .sender-name { text-align: right; }

        .message.consecutive.mine .text { border-top-right-radius: 4px; }
        html[dir="ltr"] .message.consecutive.mine .text { border-top-left-radius: 4px; border-top-right-radius: 16px; }
        .message.consecutive.others .text { border-top-left-radius: 4px; }
        html[dir="ltr"] .message.consecutive.others .text { border-top-right-radius: 4px; border-top-left-radius: 16px; }

        .message.failed .text {
            background: #fff2f2; color: #cc0000; border: 1px solid #ffcccc;
        }
        
        .retry-btn {
            display: flex; align-items: center; gap: 4px; margin-top: 6px;
            font-size: 10px; font-weight: 800; color: #cc0000; cursor: pointer;
            background: none; border: none; padding: 0;
        }

        .msg-spinner {
            display: inline-block; width: 10px; height: 10px; 
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        html[dir="ltr"] .msg-spinner { margin-right: 0; margin-left: 8px; }

        .chat-input-area {
            background: #fff; padding: 15px; border-top: 1px solid #f0ece4;
            display: flex; flex-direction: column; gap: 10px; 
            flex-shrink: 0; min-height: 90px;
        }

        .username-container {
            display: flex; align-items: center; width: 100%;
            background: #faf9f7; border: 1px solid #e4ddd4; border-radius: 12px;
            padding: 0 15px; transition: border 0.3s, background 0.3s;
            cursor: text;
        }

        .username-container:focus-within {
            border-color: #b8935a; background: #fff;
        }

        .username-container.locked-container {
            background: #f0ece4; cursor: pointer;
        }

        .username-container.locked-container:focus-within {
            border-color: #e4ddd4; background: #f0ece4;
        }

        .user-label-group {
            display: flex; align-items: center; gap: 6px;
            color: #b8935a; font-size: 12px; font-weight: 800;
            white-space: nowrap; pointer-events: none;
            border-left: 1px solid #e4ddd4; margin-left: 8px; padding-left: 8px;
        }

        html[dir="ltr"] .user-label-group {
            border-left: none; border-right: 1px solid #e4ddd4; 
            margin-left: 0; margin-right: 8px; 
            padding-left: 0; padding-right: 8px;
        }

        .username-input {
            flex-grow: 1; padding: 12px 0; border: none; background: transparent;
            font-size: 12px; font-weight: 700; color: #1d1b20; outline: none;
            width: 100%;
        }

        .username-input::placeholder { color: #a59b8d; font-weight: 500; }
        .username-input:read-only { color: #a59b8d; cursor: pointer; }

        .message-box { display: flex; gap: 8px; }
        
        .msg-input {
            flex-grow: 1; padding: 12px 15px; border: 1px solid #e4ddd4;
            border-radius: 16px; font-size: 13px; background: #faf9f7;
            transition: border 0.3s; font-weight: 500;
            resize: none; height: 44px; font-family: inherit; overflow-y: auto;
        }
        .msg-input:focus { border-color: #b8935a; outline: none; background: #fff; }

        .send-btn {
            background: #1d1b20; color: #fff; border: none; border-radius: 16px;
            width: 44px; height: 44px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .send-btn:hover { background: #b8935a; transform: translateY(-2px); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn i { font-size: 16px; margin-right: 2px; }
        html[dir="ltr"] .send-btn i { margin-right: 0; margin-left: 2px; }

        .toast-msg {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(29, 27, 32, 0.9); color: #fff; padding: 10px 16px;
            border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 1000;
        }
        .toast-msg.show { opacity: 1; }

        .admin-badge {
            position: relative; padding: 4px 12px; border-radius: 14px; font-size: 10px;
            font-weight: 800; margin: 0 4px; display: inline-flex; align-items: center;
            gap: 4px; vertical-align: middle; color: #ffffff; overflow: hidden;
            box-shadow: 0 2px 10px rgba(139, 0, 0, 0.5); z-index: 1; border: none; 
            animation: badgeShimmerText 1.5s infinite alternate ease-in-out;
        }

        .admin-badge::before {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: conic-gradient(from 0deg, transparent 70%, #ffffff 100%);
            animation: wormSpin 2s linear infinite; z-index: -2;
        }

        .admin-badge::after {
            content: ''; position: absolute; inset: 1.5px; 
            background: linear-gradient(135deg, #5c0000, #8b0000); 
            border-radius: 12px; z-index: -1;
        }

        @keyframes wormSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes badgeShimmerText {
            0% { text-shadow: 0 0 2px rgba(255, 255, 255, 0.3); }
            100% { text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 15px rgba(255, 255, 255, 0.6); }
        }

        .admin-badge i { color: inherit; filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8)); }

        .reply-preview-container {
            display: none; background: #faf9f7; border: 1px solid #e4ddd4;
            border-right: 4px solid #b8935a; border-radius: 12px;
            padding: 10px 15px; margin-bottom: 10px; position: relative;
            animation: fadeIn 0.2s ease;
        }
        html[dir="ltr"] .reply-preview-container { border-right: 1px solid #e4ddd4; border-left: 4px solid #b8935a; }
        .reply-preview-container.active { display: block; }
        .reply-close {
            position: absolute; top: 10px; left: 15px; background: #f0ece4;
            width: 22px; height: 22px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 10px;
            color: #7d6b52; cursor: pointer; transition: 0.2s;
        }
        .reply-close:active { transform: scale(0.9); }
        html[dir="ltr"] .reply-close { left: auto; right: 15px; }
        .reply-preview-header { font-size: 11px; font-weight: 800; color: #b8935a; margin-bottom: 2px; }
        .reply-preview-text { font-size: 12px; color: #7d6b52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: 30px; }
        html[dir="ltr"] .reply-preview-text { margin-left: 0; margin-right: 30px; }

        .quoted-msg {
            background: rgba(0,0,0,0.04); border-right: 3px solid #b8935a;
            padding: 6px 10px; border-radius: 6px; margin-bottom: 8px;
            cursor: pointer; transition: opacity 0.2s;
        }
        html[dir="ltr"] .quoted-msg { border-right: none; border-left: 3px solid #b8935a; }
        .message.mine .quoted-msg { background: rgba(0,0,0,0.1); border-color: #fff; }
        .quoted-msg:active { opacity: 0.7; }
        .quote-sender { font-size: 10px; font-weight: 800; margin-bottom: 2px; color: #b8935a; }
        .message.mine .quote-sender { color: #fff; }
        .quote-text { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }

        .actual-content { display: inline; word-wrap: break-word; white-space: pre-wrap; }
        .trans-btn-inline {
            display: inline-block; margin: 0 8px; font-size: 13px; color: #a59b8d;
            cursor: pointer; transition: 0.2s; opacity: 0.8; vertical-align: middle;
        }
        .message.mine .trans-btn-inline { color: rgba(255,255,255,0.8); }
        .trans-btn-inline:active { transform: scale(0.85); }
    </style>
</head>
<body>

    <div class="chat-card" id="chatCard">
        
        <div class="loader-overlay" id="loaderOverlay">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">جاري تحميل المحادثات...</div>
        </div>

        <div class="chat-header">
            <div class="close-btn" id="closeChatBtn"><i class="fas fa-times"></i></div>
            <i class="fas fa-comments"></i>
            <div>
                <h2 id="chatTitle">محادثة جماعية</h2>
                <p id="chatSub">محادثة جماعية مباشرة</p>
            </div>
        </div>

        <div class="chat-messages" id="chatBox"></div>

        <div class="chat-input-area">
            <div class="reply-preview-container" id="replyPreviewContainer">
                <div class="reply-close" onclick="window.cancelReply()"><i class="fas fa-times"></i></div>
                <div class="reply-preview-header" id="replyPreviewName"></div>
                <div class="reply-preview-text" id="replyPreviewText"></div>
            </div>
            
            <div class="username-container" id="userContainer">
                <div class="user-label-group">
                    <i class="fas fa-user"></i>
                    <span id="nameLabelText">الاسم</span>
                </div>
                <input type="text" id="userName" class="username-input" placeholder="اسمك..." maxlength="20">
            </div>
            <div class="message-box">
                <textarea id="msgText" class="msg-input" placeholder="اكتب رسالتك..." rows="1" autocomplete="off"></textarea>
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        
        <div id="toastMsg" class="toast-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, serverTimestamp, goOffline, goOnline, onValue, set, get } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlSb2RsFDei6KFh2VvrKyM-ydDrhxV3aE",
            authDomain: "twaiqchat.firebaseapp.com",
            databaseURL: "https://twaiqchat-default-rtdb.firebaseio.com",
            projectId: "twaiqchat",
            storageBucket: "twaiqchat.firebasestorage.app",
            messagingSenderId: "377499668649",
            appId: "1:377499668649:web:6aed4ccacd1b3c7dcc99b8",
            measurementId: "G-5MYK8MHNGR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        
        signInAnonymously(auth).catch((error) => console.error(error));

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('uid') || 'default';
        const ADMIN_UIDS = ['233878', '٢٣٣٨٧٨'];
        const isAdminUser = ADMIN_UIDS.includes(userId);

        const chatRef = ref(db, 'global_messages');
        const userProfileRef = ref(db, 'chat_users/' + userId);

        const chatBox = document.getElementById('chatBox');
        const userContainer = document.getElementById('userContainer');
        const userNameInput = document.getElementById('userName');
        const msgTextInput = document.getElementById('msgText');
        const sendBtn = document.getElementById('sendBtn');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const toastMsg = document.getElementById('toastMsg');
        const loaderOverlay = document.getElementById('loaderOverlay');

        const pendingMessages = new Set();
        window.currentReplyTo = null;

        const LANG_DICT = {
            ar: {
                dir: 'rtl',
                title: 'دردشة جماعية',
                h2: 'محادثة جماعية',
                p: 'محادثة جماعية مباشرة مع جميع المشتركين',
                namePlaceholder: 'أدخل اسمك...',
                nameLabel: 'الاسم',
                msgPlaceholder: 'اكتب رسالتك...',
                mustEnterName: 'فضلاً، أدخل اسمك أولاً لتتمكن من المشاركة',
                toastWait1: 'يرجى الانتظار ',
                toastWait2: ' دقيقة لتعديل الاسم مجدداً',
                loading: 'جاري تحميل المحادثات...',
                retry: 'إعادة المحاولة',
                sendFailed: 'تعذر الإرسال، تحقق من اتصالك',
                adminBadge: '<i class="fas fa-shield-alt"></i> الآدمن'
            },
            en: {
                dir: 'ltr',
                title: 'Group Chat',
                h2: 'Group Chat',
                p: 'Live Group Chat',
                namePlaceholder: 'Enter your name...',
                nameLabel: 'Name',
                msgPlaceholder: 'Type your message...',
                mustEnterName: 'Please enter your name first to participate',
                toastWait1: 'Please wait ',
                toastWait2: ' minutes to edit name again',
                loading: 'Loading messages...',
                retry: 'Retry',
                sendFailed: 'Failed to send, check connection',
                adminBadge: '<i class="fas fa-shield-alt"></i> Admin'
            }
        };

        let currentLang = 'en';
        try {
            let sysLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            currentLang = sysLang.startsWith('ar') ? 'ar' : 'en';
        } catch (e) {
            currentLang = 'en';
        }

        function applyLanguage() {
            const d = LANG_DICT[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = d.dir;
            document.title = d.title;
            document.getElementById('chatTitle').innerText = d.h2;
            document.getElementById('chatSub').innerText = d.p;
            document.getElementById('userName').placeholder = d.namePlaceholder;
            document.getElementById('nameLabelText').innerText = d.nameLabel;
            document.getElementById('msgText').placeholder = d.msgPlaceholder;
            document.getElementById('loaderText').innerText = d.loading;
        }
        applyLanguage();

        function isDiffLang(text, sysLang) {
            if (!text) return false;
            const arMatches = text.match(/[\u0600-\u06FF]/g) || [];
            const enMatches = text.match(/[a-zA-Z]/g) || [];
            if (sysLang === 'ar' && enMatches.length > arMatches.length) return true;
            if (sysLang === 'en' && arMatches.length > enMatches.length) return true;
            return false;
        }

        window.setReply = function(id, sender, text) {
            window.currentReplyTo = { id, sender, text };
            document.getElementById('replyPreviewName').innerText = sender || LANG_DICT[currentLang].nameLabel;
            document.getElementById('replyPreviewText').innerText = text;
            document.getElementById('replyPreviewContainer').classList.add('active');
            msgTextInput.focus();
        };

        window.cancelReply = function() {
            window.currentReplyTo = null;
            const container = document.getElementById('replyPreviewContainer');
            if (container) container.classList.remove('active');
        };

            window.translateMsg = async function(btn, text, container) {
            const contentSpan = container.querySelector('.actual-content');
            
            
            if (btn.dataset.translated === 'true') {
                contentSpan.innerHTML = escapeHTML(text);
                btn.dataset.translated = 'false';
                btn.classList.remove('fa-undo');
                btn.classList.add('fa-language');
                return;
            }
            
            btn.classList.remove('fa-language');
            btn.classList.add('fa-spinner', 'fa-spin');
            
            try {
                const targetLang = currentLang === 'ar' ? 'ar' : 'en';
                const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;
                
                const res = await fetch(url);
                const data = await res.json();
                const translated = data[0].map(item => item[0]).join('');
                
                contentSpan.innerHTML = escapeHTML(translated);
                btn.dataset.translated = 'true';
                btn.classList.remove('fa-spinner', 'fa-spin');
                btn.classList.add('fa-undo');
            } catch(e) {
                showToast(LANG_DICT[currentLang].sendFailed);
                btn.classList.remove('fa-spinner', 'fa-spin');
                btn.classList.add('fa-language');
            }
        };


        function hideLoader() {
            loaderOverlay.style.opacity = '0';
            setTimeout(() => { loaderOverlay.style.visibility = 'hidden'; }, 300);
        }

        get(chatRef).then(hideLoader).catch(hideLoader);

        function setRealVh() {
            let vh = window.innerHeight;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            setTimeout(() => { if(chatBox) chatBox.scrollTop = chatBox.scrollHeight; }, 100);
        }
        window.addEventListener('resize', setRealVh);
        setRealVh();

        let serverOffset = 0;
        const offsetRef = ref(db, ".info/serverTimeOffset");
        onValue(offsetRef, (snap) => {
            serverOffset = snap.val() || 0;
        });

        function getTrueServerTime() {
            return Date.now() + serverOffset;
        }

        function showToast(text) {
            toastMsg.innerText = text;
            toastMsg.classList.add('show');
            setTimeout(() => { toastMsg.classList.remove('show'); }, 3000);
        }

        function killConnection() {
            try { goOffline(db); } catch(e) {}
        }

        function restoreConnection() {
            try { goOnline(db); } catch(e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') killConnection();
            else restoreConnection();
        });

        window.addEventListener('pagehide', killConnection);
        window.addEventListener('unload', killConnection);

        closeChatBtn.addEventListener('click', function() {
            killConnection();
            window.location.href = "ninja://close";
        });

        function lockNameInput() {
            userNameInput.readOnly = true;
            userContainer.classList.add('locked-container');
        }

        function unlockNameInput() {
            userNameInput.readOnly = false;
            userContainer.classList.remove('locked-container');
            userNameInput.focus();
        }

        let isNameRegistered = false;

        if(userId !== 'default') {
            onValue(userProfileRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.val();
                    if (data.name) {
                        userNameInput.value = data.name;
                        lockNameInput();
                        isNameRegistered = true;
                        localStorage.setItem('twaiqChatName', data.name);
                        localStorage.setItem('twaiqNameLastEdit', data.lastEdit || '0');
                    }
                }
            });
        } else {
            const savedName = localStorage.getItem('twaiqChatName');
            if (savedName) {
                userNameInput.value = savedName;
                lockNameInput();
            }
        }

        const COOLDOWN_MS = 60 * 60 * 1000; 

        userContainer.addEventListener('click', () => {
            if (!userNameInput.readOnly) return;
            
            const lastEdit = parseInt(localStorage.getItem('twaiqNameLastEdit') || '0', 10);
            const now = getTrueServerTime();
            const diff = now - lastEdit;
            
            if (diff < COOLDOWN_MS && lastEdit !== 0) {
                const remainingMins = Math.ceil((COOLDOWN_MS - diff) / 60000);
                showToast(LANG_DICT[currentLang].toastWait1 + remainingMins + LANG_DICT[currentLang].toastWait2);
            } else {
                unlockNameInput();
            }
        });

        msgTextInput.addEventListener('focus', () => {
            const name = userNameInput.value.trim();
            if (!name && !isAdminUser) {
                msgTextInput.blur();
                showToast(LANG_DICT[currentLang].mustEnterName);
            }
        });

        function renderFailedMessage(name, text, replyToObj) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message mine failed`;
            
            const currentSenderId = (userId !== 'default' ? userId : 'unknown') + '|' + (name || '');
            msgDiv.setAttribute('data-sender-id', currentSenderId);

            let showName = true;
            const lastMsg = chatBox.lastElementChild;
            if (lastMsg && lastMsg.getAttribute('data-sender-id') === currentSenderId) {
                showName = false;
                msgDiv.style.marginTop = '-12px';
                msgDiv.classList.add('consecutive');
            }

            if (showName) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'sender-name';
                nameDiv.innerText = name ? name : '';
                msgDiv.appendChild(nameDiv);
            }

            const textWrapper = document.createElement('div');
            textWrapper.className = 'text';

            if (replyToObj) {
                const quoteDiv = document.createElement('div');
                quoteDiv.className = 'quoted-msg';
                quoteDiv.innerHTML = `
                    <div class="quote-sender">${escapeHTML(replyToObj.sender || '')}</div>
                    <div class="quote-text">${escapeHTML(replyToObj.text || '')}</div>
                `;
                textWrapper.appendChild(quoteDiv);
            }

            const msgBody = document.createElement('div');
            msgBody.innerHTML = `<span class="actual-content">${escapeHTML(text)}</span>`;
            msgBody.innerHTML += `<div style="font-size: 9px; margin-top: 4px; color: #cc0000;">${LANG_DICT[currentLang].sendFailed}</div>`;
            
            const retryBtn = document.createElement('button');
            retryBtn.className = 'retry-btn';
            retryBtn.innerHTML = `<i class="fas fa-redo-alt"></i> ${LANG_DICT[currentLang].retry}`;
            retryBtn.addEventListener('click', () => {
                msgDiv.remove();
                window.currentReplyTo = replyToObj;
                executeSend(name, text);
            });
            msgBody.appendChild(retryBtn);

            textWrapper.appendChild(msgBody);
            msgDiv.appendChild(textWrapper);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function executeSend(name, text) {
            const replyPayload = window.currentReplyTo;
            
            if (!navigator.onLine) {
                window.cancelReply();
                renderFailedMessage(name, text, replyPayload);
                return;
            }

            window.cancelReply();
            const nowTime = getTrueServerTime();

            if (!userNameInput.readOnly && (name || isAdminUser)) {
                localStorage.setItem('twaiqChatName', name);
                localStorage.setItem('twaiqNameLastEdit', nowTime.toString());
                
                if(userId !== 'default' && name) {
                    set(userProfileRef, { name: name, lastEdit: nowTime }).catch(()=>{});
                }

                lockNameInput();
                isNameRegistered = true;
            }

            const newMsgRef = push(chatRef);
            const msgKey = newMsgRef.key;
            pendingMessages.add(msgKey);
            let isConfirmed = false;

            const payload = {
                uid: userId,
                sender: name,
                text: text,
                timestamp: serverTimestamp()
            };

            if (replyPayload) {
                payload.replyTo = replyPayload;
            }

            set(newMsgRef, payload).then(() => {
                isConfirmed = true;
                pendingMessages.delete(msgKey);
                const s = document.getElementById(`spinner-${msgKey}`);
                if (s) s.remove();
                set(ref(db, 'notifications/last_msg_tick'), nowTime).catch(()=>{});
            }).catch(() => {
                if (!isConfirmed) {
                    isConfirmed = true;
                    pendingMessages.delete(msgKey);
                    set(newMsgRef, null).catch(()=>{});
                    renderFailedMessage(name, text, replyPayload);
                }
            });

            setTimeout(() => {
                if (!isConfirmed) {
                    isConfirmed = true;
                    pendingMessages.delete(msgKey);
                    set(newMsgRef, null).catch(()=>{});
                    renderFailedMessage(name, text, replyPayload);
                }
            }, 7000); 
        }

        function sendMessage() {
            const name = userNameInput.value.trim();
            const text = msgTextInput.value.trim();

            if (!name && !isAdminUser) {
                showToast(LANG_DICT[currentLang].mustEnterName);
                return;
            }

            if (text === '') return;

            executeSend(name, text);

            msgTextInput.value = '';
            msgTextInput.style.height = '44px';
            msgTextInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);

        msgTextInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function attachSwipeListener(element, snapshotKey, sender, text) {
            let startX = 0, startY = 0, currentX = 0;
            let isSwiping = false;
            let isVerticalScroll = false;
            
            element.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                currentX = startX;
                isSwiping = true;
                isVerticalScroll = false;
                element.style.transition = 'none';
            }, {passive: true});
            
            element.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                currentX = e.touches[0].clientX;
                let currentY = e.touches[0].clientY;
                let deltaX = currentX - startX;
                let deltaY = currentY - startY;
                
                if (!isVerticalScroll && Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 10) {
                    isVerticalScroll = true;
                    element.style.transform = `translateX(0px)`;
                    return;
                }

                if (isVerticalScroll) return;

                if (deltaX < 0) deltaX = 0; 
                
                if (Math.abs(deltaX) > 60) {
                    deltaX = Math.sign(deltaX) * (60 + (Math.abs(deltaX) - 60) * 0.15);
                }
                
                if (Math.abs(deltaX) > 5) {
                    element.style.transform = `translateX(${deltaX}px)`;
                }
            }, {passive: true});
            
            element.addEventListener('touchend', (e) => {
                if (!isSwiping) return;
                isSwiping = false;
                element.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1)';
                element.style.transform = `translateX(0px)`;
                
                if (isVerticalScroll) return;

                let deltaX = currentX - startX;
                
                if (deltaX < 0) return; 

                if (Math.abs(deltaX) > 50) { 
                    window.setReply(snapshotKey, sender, text);
                    if (window.navigator && window.navigator.vibrate) window.navigator.vibrate(50);
                }
            });
        }

        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const msgUid = data.uid || 'unknown';
            
            const isMine = (msgUid === userId && userId !== 'default') || 
                           (data.sender === userNameInput.value.trim() && data.sender !== '');

            const isMsgAdmin = ADMIN_UIDS.includes(msgUid);
            const badgeHtml = isMsgAdmin ? `<span class="admin-badge">${LANG_DICT[currentLang].adminBadge}</span>` : '';
            const senderText = data.sender ? escapeHTML(data.sender) : '';

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMine ? 'mine' : 'others'}`;
            msgDiv.setAttribute('data-key', snapshot.key);
            
            const currentSenderId = msgUid + '|' + (data.sender || '');
            msgDiv.setAttribute('data-sender-id', currentSenderId);

            let showName = true;
            const lastMsg = chatBox.lastElementChild;
            if (lastMsg && lastMsg.getAttribute('data-sender-id') === currentSenderId) {
                showName = false;
                msgDiv.style.marginTop = '-12px';
                msgDiv.classList.add('consecutive');
            }

            if (showName) {
                const nameDiv = document.createElement('div');
                nameDiv.className = 'sender-name';
                nameDiv.innerHTML = `${senderText} ${badgeHtml}`;
                msgDiv.appendChild(nameDiv);
            }

            const textWrapper = document.createElement('div');
            textWrapper.className = 'text';

            if (data.replyTo) {
                const quoteDiv = document.createElement('div');
                quoteDiv.className = 'quoted-msg';
                quoteDiv.innerHTML = `
                    <div class="quote-sender">${escapeHTML(data.replyTo.sender || '')}</div>
                    <div class="quote-text">${escapeHTML(data.replyTo.text || '')}</div>
                `;
                quoteDiv.addEventListener('click', () => {
                    const target = document.querySelector(`[data-key="${data.replyTo.id}"]`);
                    if(target) {
                        target.scrollIntoView({behavior: 'smooth', block: 'center'});
                        target.style.transition = 'transform 0.3s';
                        target.style.transform = 'scale(1.02)';
                        setTimeout(() => target.style.transform = 'scale(1)', 300);
                    }
                });
                textWrapper.appendChild(quoteDiv);
            }

            const msgBody = document.createElement('div');
            
            const actualContent = document.createElement('span');
            actualContent.className = 'actual-content';
            actualContent.innerHTML = escapeHTML(data.text);
            msgBody.appendChild(actualContent);

            if (isDiffLang(data.text, currentLang)) {
                const transBtn = document.createElement('i');
                transBtn.className = 'fas fa-language trans-btn-inline';
                transBtn.dataset.translated = 'false';
                transBtn.addEventListener('click', (e) => window.translateMsg(e.target, data.text, msgBody));
                msgBody.appendChild(transBtn);
            }

            if (pendingMessages.has(snapshot.key)) {
                msgBody.innerHTML += `<span class="msg-spinner" id="spinner-${snapshot.key}"></span>`;
            }
            textWrapper.appendChild(msgBody);
            
            attachSwipeListener(textWrapper, snapshot.key, data.sender, data.text);

            msgDiv.appendChild(textWrapper);

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        onChildRemoved(chatRef, (snapshot) => {
            const msgDiv = document.querySelector(`[data-key="${snapshot.key}"]`);
            if (msgDiv) {
                msgDiv.remove();
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            let escaped = str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
            return escaped.replace(/\n/g, '<br>').replace(/\\n/g, '<br>');
        }
    </script>
</body>
</html>

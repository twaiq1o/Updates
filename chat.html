<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دردشة طويق</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: transparent; 
            margin: 0; padding: 0;
            min-height: 580px; 
            width: 100vw;
            overflow: hidden;
        }

        .chat-card {
            background: #fff; border: 1px solid #e4ddd4; border-radius: 32px;
            width: calc(100% - 32px); max-width: 360px; 
            height: 550px; 
            max-height: calc(100vh - 32px);
            max-height: calc(var(--vh, 100vh) - 32px);
            position: fixed;
            top: 50%; left: 50%;
            display: flex; flex-direction: column;
            box-shadow: 0 15px 35px rgba(125,107,82,.15);
            overflow: hidden;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: max-height 0.3s ease;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -40%) scale(0.95); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .loader-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #faf9f7; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .spinner {
            width: 45px; height: 45px; border: 4px solid #e4ddd4;
            border-top-color: #b8935a; border-radius: 50%;
            animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .loader-text { font-size: 14px; font-weight: 700; color: #7d6b52; }

        .chat-header {
            background: #fff; padding: 20px; border-bottom: 1px solid #f0ece4;
            display: flex; align-items: center; gap: 12px; z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); position: relative; 
            flex-shrink: 0; min-height: 80px; 
        }

        .chat-header i.fa-comments { color: #b8935a; font-size: 24px; }
        .chat-header h2 { font-size: 18px; color: #1d1b20; font-weight: 800; margin-bottom: 2px;}
        .chat-header p { font-size: 11px; color: #7d6b52; font-weight: 600;}

        .close-btn {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            background: #faf9f7; border: 1px solid #f0ece4; color: #1d1b20;
            width: 32px; height: 32px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            transition: all 0.2s;
        }
        
        html[dir="ltr"] .close-btn { left: auto; right: 20px; }
        .close-btn:active { transform: translateY(-50%) scale(0.9); }
        .close-btn i { font-size: 14px; }

        .chat-messages {
            flex-grow: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            background-color: #faf9f7;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #e4ddd4; border-radius: 10px; }

        .message {
            max-width: 85%; display: flex; flex-direction: column;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message .sender-name {
            font-size: 10px; font-weight: 700; color: #a59b8d; margin-bottom: 4px;
        }

        .message .text {
            padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5;
            word-wrap: break-word; font-weight: 500;
        }

        .message.mine { align-self: flex-start; }
        .message.mine .text { background: #b8935a; color: #fff; border-bottom-right-radius: 4px; }
        html[dir="ltr"] .message.mine .text { border-bottom-right-radius: 16px; border-bottom-left-radius: 4px; }
        .message.mine .sender-name { text-align: right; color: #b8935a; }
        html[dir="ltr"] .message.mine .sender-name { text-align: left; }

        .message.others { align-self: flex-end; }
        .message.others .text { background: #fff; color: #1d1b20; border: 1px solid #f0ece4; border-bottom-left-radius: 4px; }
        html[dir="ltr"] .message.others .text { border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
        .message.others .sender-name { text-align: left; }
        html[dir="ltr"] .message.others .sender-name { text-align: right; }

        .message.failed .text {
            background: #fff2f2; color: #cc0000; border: 1px solid #ffcccc;
        }
        
        .retry-btn {
            display: flex; align-items: center; gap: 4px; margin-top: 6px;
            font-size: 10px; font-weight: 800; color: #cc0000; cursor: pointer;
            background: none; border: none; padding: 0;
        }

        .msg-spinner {
            display: inline-block; width: 10px; height: 10px; 
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle; margin-right: 8px;
        }
        html[dir="ltr"] .msg-spinner { margin-right: 0; margin-left: 8px; }

        .chat-input-area {
            background: #fff; padding: 15px; border-top: 1px solid #f0ece4;
            display: flex; flex-direction: column; gap: 10px; 
            flex-shrink: 0; min-height: 90px;
        }

        .username-container {
            display: flex; align-items: center; width: 100%;
            background: #faf9f7; border: 1px solid #e4ddd4; border-radius: 12px;
            padding: 0 15px; transition: border 0.3s, background 0.3s;
            cursor: text;
        }

        .username-container:focus-within {
            border-color: #b8935a; background: #fff;
        }

        .username-container.locked-container {
            background: #f0ece4; cursor: pointer;
        }

        .username-container.locked-container:focus-within {
            border-color: #e4ddd4; background: #f0ece4;
        }

        .user-label-group {
            display: flex; align-items: center; gap: 6px;
            color: #b8935a; font-size: 12px; font-weight: 800;
            white-space: nowrap; pointer-events: none;
            border-left: 1px solid #e4ddd4; margin-left: 8px; padding-left: 8px;
        }

        html[dir="ltr"] .user-label-group {
            border-left: none; border-right: 1px solid #e4ddd4; 
            margin-left: 0; margin-right: 8px; 
            padding-left: 0; padding-right: 8px;
        }

        .username-input {
            flex-grow: 1; padding: 12px 0; border: none; background: transparent;
            font-size: 12px; font-weight: 700; color: #1d1b20; outline: none;
            width: 100%;
        }

        .username-input::placeholder { color: #a59b8d; font-weight: 500; }
        .username-input:read-only { color: #a59b8d; cursor: pointer; }

        .message-box { display: flex; gap: 8px; }
        
        .msg-input {
            flex-grow: 1; padding: 12px 15px; border: 1px solid #e4ddd4;
            border-radius: 16px; font-size: 13px; background: #faf9f7;
            transition: border 0.3s; font-weight: 500;
        }
        .msg-input:focus { border-color: #b8935a; outline: none; background: #fff; }

        .send-btn {
            background: #1d1b20; color: #fff; border: none; border-radius: 16px;
            width: 44px; height: 44px; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .send-btn:hover { background: #b8935a; transform: translateY(-2px); }
        .send-btn:active { transform: scale(0.95); }
        .send-btn i { font-size: 16px; margin-right: 2px; }
        html[dir="ltr"] .send-btn i { margin-right: 0; margin-left: 2px; }

        .toast-msg {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(29, 27, 32, 0.9); color: #fff; padding: 10px 16px;
            border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
            pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 1000;
        }
        .toast-msg.show { opacity: 1; }

    </style>
</head>
<body>

    <div class="chat-card" id="chatCard">
        
        <div class="loader-overlay" id="loaderOverlay">
            <div class="spinner"></div>
            <div class="loader-text" id="loaderText">جاري تحميل المحادثات...</div>
        </div>

        <div class="chat-header">
            <div class="close-btn" id="closeChatBtn"><i class="fas fa-times"></i></div>
            <i class="fas fa-comments"></i>
            <div>
                <h2 id="chatTitle">محادثة طويق</h2>
                <p id="chatSub">محادثة جماعية مباشرة</p>
            </div>
        </div>

        <div class="chat-messages" id="chatBox"></div>

        <div class="chat-input-area">
            <div class="username-container" id="userContainer">
                <div class="user-label-group">
                    <i class="fas fa-user"></i>
                    <span id="nameLabelText">الاسم</span>
                </div>
                <input type="text" id="userName" class="username-input" placeholder="اسمك..." maxlength="20">
            </div>
            <div class="message-box">
                <input type="text" id="msgText" class="msg-input" placeholder="اكتب رسالتك..." autocomplete="off">
                <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
        
        <div id="toastMsg" class="toast-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, serverTimestamp, goOffline, goOnline, onValue, set, get } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAlSb2RsFDei6KFh2VvrKyM-ydDrhxV3aE",
            authDomain: "twaiqchat.firebaseapp.com",
            databaseURL: "https://twaiqchat-default-rtdb.firebaseio.com",
            projectId: "twaiqchat",
            storageBucket: "twaiqchat.firebasestorage.app",
            messagingSenderId: "377499668649",
            appId: "1:377499668649:web:6aed4ccacd1b3c7dcc99b8",
            measurementId: "G-5MYK8MHNGR"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('uid') || 'default';

        const chatRef = ref(db, 'global_messages');
        const userProfileRef = ref(db, 'chat_users/' + userId);

        const chatBox = document.getElementById('chatBox');
        const userContainer = document.getElementById('userContainer');
        const userNameInput = document.getElementById('userName');
        const msgTextInput = document.getElementById('msgText');
        const sendBtn = document.getElementById('sendBtn');
        const closeChatBtn = document.getElementById('closeChatBtn');
        const toastMsg = document.getElementById('toastMsg');
        const loaderOverlay = document.getElementById('loaderOverlay');

        const pendingMessages = new Set();

        const LANG_DICT = {
            ar: {
                dir: 'rtl',
                title: 'دردشة جماعية',
                h2: 'محادثة جماعية',
                p: 'محادثة جماعية مباشرة مع جميع المشتركين',
                namePlaceholder: 'أدخل اسمك...',
                nameLabel: 'الاسم',
                msgPlaceholder: 'اكتب رسالتك...',
                mustEnterName: 'يجب اختيار اسم أولاً قبل الكتابة',
                toastWait1: 'يرجى الانتظار ',
                toastWait2: ' دقيقة لتعديل الاسم مجدداً',
                loading: 'جاري تحميل المحادثات...',
                retry: 'إعادة المحاولة',
                sendFailed: 'تعذر الإرسال، تحقق من اتصالك'
            },
            en: {
                dir: 'ltr',
                title: 'Group Chat',
                h2: 'Group Chat',
                p: 'Live Group Chat',
                namePlaceholder: 'enter your name...',
                nameLabel: 'Name',
                msgPlaceholder: 'Type your message...',
                mustEnterName: 'You must enter a name first',
                toastWait1: 'Please wait ',
                toastWait2: ' minutes to edit name again',
                loading: 'Loading messages...',
                retry: 'Retry',
                sendFailed: 'Failed to send, check connection'
            }
        };

        let currentLang = 'ar';
        try {
            let sysLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            currentLang = sysLang.startsWith('en') ? 'en' : 'ar';
        } catch (e) {
            currentLang = 'ar';
        }

        function applyLanguage() {
            const d = LANG_DICT[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = d.dir;
            document.title = d.title;
            document.getElementById('chatTitle').innerText = d.h2;
            document.getElementById('chatSub').innerText = d.p;
            document.getElementById('userName').placeholder = d.namePlaceholder;
            document.getElementById('nameLabelText').innerText = d.nameLabel;
            document.getElementById('msgText').placeholder = d.msgPlaceholder;
            document.getElementById('loaderText').innerText = d.loading;
        }
        applyLanguage();

        function hideLoader() {
            loaderOverlay.style.opacity = '0';
            setTimeout(() => { loaderOverlay.style.visibility = 'hidden'; }, 300);
        }

        get(chatRef).then(hideLoader).catch(hideLoader);

        function setRealVh() {
            let vh = window.innerHeight;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            setTimeout(() => { if(chatBox) chatBox.scrollTop = chatBox.scrollHeight; }, 100);
        }
        window.addEventListener('resize', setRealVh);
        setRealVh();

        let serverOffset = 0;
        const offsetRef = ref(db, ".info/serverTimeOffset");
        onValue(offsetRef, (snap) => {
            serverOffset = snap.val() || 0;
        });

        function getTrueServerTime() {
            return Date.now() + serverOffset;
        }

        function showToast(text) {
            toastMsg.innerText = text;
            toastMsg.classList.add('show');
            setTimeout(() => { toastMsg.classList.remove('show'); }, 3000);
        }

        function killConnection() {
            try { goOffline(db); } catch(e) {}
        }

        function restoreConnection() {
            try { goOnline(db); } catch(e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') killConnection();
            else restoreConnection();
        });

        window.addEventListener('pagehide', killConnection);
        window.addEventListener('unload', killConnection);

        closeChatBtn.addEventListener('click', function() {
            killConnection();
            window.location.href = "ninja://close";
        });

        function lockNameInput() {
            userNameInput.readOnly = true;
            userContainer.classList.add('locked-container');
        }

        function unlockNameInput() {
            userNameInput.readOnly = false;
            userContainer.classList.remove('locked-container');
            userNameInput.focus();
        }

        let isNameRegistered = false;

        if(userId !== 'default') {
            onValue(userProfileRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.val();
                    if (data.name) {
                        userNameInput.value = data.name;
                        lockNameInput();
                        isNameRegistered = true;
                        localStorage.setItem('twaiqChatName', data.name);
                        localStorage.setItem('twaiqNameLastEdit', data.lastEdit || '0');
                    }
                }
            });
        } else {
            const savedName = localStorage.getItem('twaiqChatName');
            if (savedName) {
                userNameInput.value = savedName;
                lockNameInput();
            }
        }

        const COOLDOWN_MS = 60 * 60 * 1000; 

        userContainer.addEventListener('click', () => {
            if (!userNameInput.readOnly) return;
            
            const lastEdit = parseInt(localStorage.getItem('twaiqNameLastEdit') || '0', 10);
            const now = getTrueServerTime();
            const diff = now - lastEdit;
            
            if (diff < COOLDOWN_MS && lastEdit !== 0) {
                const remainingMins = Math.ceil((COOLDOWN_MS - diff) / 60000);
                showToast(LANG_DICT[currentLang].toastWait1 + remainingMins + LANG_DICT[currentLang].toastWait2);
            } else {
                unlockNameInput();
            }
        });

        msgTextInput.addEventListener('focus', () => {
            const name = userNameInput.value.trim();
            if (!name) {
                msgTextInput.blur();
                showToast(LANG_DICT[currentLang].mustEnterName);
                userNameInput.focus();
            }
        });

        function renderFailedMessage(name, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message mine failed`;
            msgDiv.innerHTML = `
                <div class="sender-name">${escapeHTML(name)}</div>
                <div class="text">
                    ${escapeHTML(text)}
                    <div style="font-size: 9px; margin-top: 4px; color: #cc0000;">${LANG_DICT[currentLang].sendFailed}</div>
                    <button class="retry-btn"><i class="fas fa-redo-alt"></i> ${LANG_DICT[currentLang].retry}</button>
                </div>
            `;
            
            msgDiv.querySelector('.retry-btn').addEventListener('click', () => {
                msgDiv.remove();
                executeSend(name, text);
            });

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function executeSend(name, text) {
            if (!navigator.onLine) {
                renderFailedMessage(name, text);
                return;
            }

            const nowTime = getTrueServerTime();

            if (!userNameInput.readOnly) {
                localStorage.setItem('twaiqChatName', name);
                localStorage.setItem('twaiqNameLastEdit', nowTime.toString());
                
                if(userId !== 'default') {
                    set(userProfileRef, { name: name, lastEdit: nowTime }).catch(()=>{});
                }

                lockNameInput();
                isNameRegistered = true;
            }

            const newMsgRef = push(chatRef);
            const msgKey = newMsgRef.key;
            pendingMessages.add(msgKey);
            let isConfirmed = false;

            set(newMsgRef, {
                uid: userId,
                sender: name,
                text: text,
                timestamp: serverTimestamp()
            }).then(() => {
                isConfirmed = true;
                pendingMessages.delete(msgKey);
                const s = document.getElementById(`spinner-${msgKey}`);
                if (s) s.remove();
                set(ref(db, 'notifications/last_msg_tick'), nowTime).catch(()=>{});
            }).catch(() => {
                if (!isConfirmed) {
                    isConfirmed = true;
                    pendingMessages.delete(msgKey);
                    set(newMsgRef, null).catch(()=>{});
                    renderFailedMessage(name, text);
                }
            });

            setTimeout(() => {
                if (!isConfirmed) {
                    isConfirmed = true;
                    pendingMessages.delete(msgKey);
                    set(newMsgRef, null).catch(()=>{});
                    renderFailedMessage(name, text);
                }
            }, 7000); 
        }

        function sendMessage() {
            const name = userNameInput.value.trim();
            const text = msgTextInput.value.trim();

            if (!name) {
                showToast(LANG_DICT[currentLang].mustEnterName);
                userNameInput.focus();
                return;
            }

            if (text === '') return;

            executeSend(name, text);

            msgTextInput.value = '';
            msgTextInput.focus();
        }

        sendBtn.addEventListener('click', sendMessage);

        msgTextInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        onChildAdded(chatRef, (snapshot) => {
            const data = snapshot.val();
            const msgUid = data.uid || 'unknown';
            
            const isMine = (msgUid === userId && userId !== 'default') || 
                           (data.sender === userNameInput.value.trim() && data.sender !== '');

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMine ? 'mine' : 'others'}`;
            msgDiv.setAttribute('data-key', snapshot.key);
            
            let spinnerHtml = '';
            if (pendingMessages.has(snapshot.key)) {
                spinnerHtml = `<span class="msg-spinner" id="spinner-${snapshot.key}"></span>`;
            }

            msgDiv.innerHTML = `
                <div class="sender-name">${escapeHTML(data.sender)}</div>
                <div class="text">${escapeHTML(data.text)}${spinnerHtml}</div>
            `;

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        onChildRemoved(chatRef, (snapshot) => {
            const msgDiv = document.querySelector(`[data-key="${snapshot.key}"]`);
            if (msgDiv) {
                msgDiv.remove();
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }
    </script>
</body>
</html>

name: Auto Firebase Inventory

on:
  schedule:
    - cron: '0 * * * *' # يعمل تلقائياً كل ساعة (رأس كل ساعة)
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى ما أردت للتجربة

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Run Inventory Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Notification Center</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: 0; }
        
        body { 
            font-family: 'Tajawal', 'Montserrat', system-ui, sans-serif; 
            background-color: transparent !important;
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; padding: 16px;
        }

        /* حاوية النافذة مع حركة الدخول */
        .card { 
            background: #fff; border: 1px solid #e4ddd4; border-radius: 32px; 
            padding: 25px; width: 100%; max-width: 360px; 
            box-shadow: 0 15px 35px rgba(125,107,82,.15);
            display: flex; flex-direction: column; max-height: 85vh;
            position: relative; overflow: hidden;
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* شاشة التحميل المدمجة */
        .loader-overlay {
            position: absolute; inset: 0; background: #fff; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        .loader-spinner {
            width: 40px; height: 40px; border: 4px solid #f0ece4;
            border-top-color: #b8935a; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 15px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader-text { font-size: 14px; font-weight: 700; color: #7d6b52; }
        
        .content-wrapper { opacity: 0; transition: opacity 0.5s ease; display: flex; flex-direction: column; height: 100%; }
        .content-ready .loader-overlay { opacity: 0; visibility: hidden; }
        .content-ready .content-wrapper { opacity: 1; }

        /* الترويسة */
        .update-box-wrap { display: flex; align-items: center; margin-bottom: 20px; }
        html[dir="rtl"] .update-box-wrap { justify-content: flex-start; }
        html[dir="ltr"] .update-box-wrap { justify-content: flex-start; }
        
        .brand-badge { 
            width: 55px; height: 55px; background: #fff; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            border: 1px solid rgba(184,147,90,.15); box-shadow: 0 4px 10px rgba(184,147,90,.1); flex-shrink: 0;
        }
        html[dir="rtl"] .brand-badge { margin-left: 15px; }
        html[dir="ltr"] .brand-badge { margin-right: 15px; }
        
        .brand-badge i { color: #b8935a; font-size: 22px; }
        .update-txt-area { flex: 1; text-align: start; }
        .u-title-clean { font-size: 20px; font-weight: 800; color: #1d1b20; margin-bottom: 2px; letter-spacing: -0.5px; }
        .u-sub-clean { font-size: 11.5px; color: #7d6b52; font-weight: 600; line-height: 1.5; }

        /* صندوق الأخبار */
        .changelog-container { 
            background: #faf9f7; border: 1px solid #f0ece4; border-radius: 16px; 
            padding: 16px; margin-bottom: 20px; text-align: start; flex: 1; display: flex; flex-direction: column; min-height: 0;
        }
        .changelog-title { 
            font-size: 12px; font-weight: 800; color: #1d1b20; margin-bottom: 15px; 
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        .changelog-title i { color: #b8935a; font-size: 14px; }

        /* قائمة الأخبار */
        .changelog-list { 
            list-style: none; display: flex; flex-direction: column; gap: 14px; 
            overflow-y: auto; padding-left: 5px; padding-right: 5px;
        }
        .changelog-list::-webkit-scrollbar { width: 4px; }
        .changelog-list::-webkit-scrollbar-thumb { background: #e4ddd4; border-radius: 10px; }
        
        .changelog-list li { 
            display: flex; align-items: flex-start; gap: 10px; 
        }

        .cl-icon { color: #b8935a; font-size: 14px; margin-top: 4px; }
        .cl-content { display: flex; flex-direction: column; }
        .cl-tag { 
            font-size: 9.5px; font-weight: 800; background: rgba(184,147,90,.1); 
            color: #b8935a; padding: 3px 8px; border-radius: 8px; 
            align-self: flex-start; margin-bottom: 6px; letter-spacing: 0.5px;
        }
        .cl-tag.alert { background: rgba(211,47,47,.1); color: #d32f2f; }
        .cl-tag.success { background: rgba(37,211,102,.1); color: #1b9e4b; }
        .cl-title { font-size: 13.5px; font-weight: 800; color: #1d1b20; margin-bottom: 4px; line-height: 1.4; }
        .cl-desc { font-size: 11.5px; color: #4a453f; font-weight: 600; line-height: 1.6; }

        /* زر الإغلاق */
        .btn-close { 
            position: relative; background: linear-gradient(135deg, #1d1b20 0, #2f2a24 50%, #1d1b20 100%); 
            background-size: 200% auto; color: #fff; border-radius: 16px; font-weight: 700; 
            height: 50px; min-height: 50px; border: 1px solid rgba(184,147,90,.5); 
            display: flex; justify-content: center; align-items: center; gap: 8px; 
            width: 100%; cursor: pointer; font-family: inherit; font-size: 14.5px;
            transition: all 0.2s; flex-shrink: 0; box-shadow: 0 4px 15px rgba(29,27,32,.15);
        }
        .btn-close:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(29,27,32,.1); }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        
        <div class="loader-overlay">
            <div class="loader-spinner"></div>
            <div class="loader-text" id="loadingText">التحقق من البيانات...</div>
        </div>

        <div class="content-wrapper">
            <div class="update-box-wrap">
                <div class="brand-badge"><i class="far fa-newspaper"></i></div>
                <div class="update-txt-area">
                    <h3 class="u-title-clean" id="headerTitle">مركز الإشعارات</h3>
                    <p class="u-sub-clean" id="headerSub">تابع أحدث الأخبار والتنبيهات</p>
                </div>
            </div>

            <div class="changelog-container">
                <div class="changelog-title"><i class="fas fa-bolt"></i> <span id="updatesTitle">آخر التحديثات</span></div>
                
                <ul class="changelog-list" id="newsList">
                    </ul>
            </div>

            <button class="btn-close" onclick="closeDialog()">
                <i class="fas fa-check-circle"></i> <span id="closeBtnText">حسناً، إغلاق النافذة</span>
            </button>
        </div>
    </div>

    <script>
        // بيانات الأخبار باللغتين
        const newsData = {
            ar: {
                loading: "التحقق من البيانات...",
                headerTitle: "مركز الإشعارات",
                headerSub: "تابع أحدث الأخبار والتنبيهات",
                updatesTitle: "آخر التحديثات",
                closeBtnText: "حسناً، إغلاق النافذة",
                news: [
                    { icon: "fa-rocket", iconColor: "", tag: "جديد - الإصدار v13.7", tagClass: "success", title: "أداء أسرع واستقرار أعلى", desc: "تم تحسين خوارزمية الاتصال بالسيرفر لضمان استجابة أسرع بنسبة 40% للحصول على أولوية في الطلبات." },
                    { icon: "fa-server", iconColor: "color: #d32f2f;", tag: "تنبيه سيرفرات", tagClass: "alert", title: "صيانة مجدولة للنظام", desc: "سيكون هناك صيانة سريعة لقواعد البيانات يوم الجمعة فجراً تستغرق 10 دقائق فقط." },
                    { icon: "fa-music", iconColor: "", tag: "ميزة مضافة", tagClass: "", title: "نغمات احترافية للطلبات", desc: "أصبح بإمكانك الآن تخصيص نغمة استلام الطلب بصوت احترافي عبر إعدادات لوحة التحكم بسهولة." }
                ]
            },
            en: {
                loading: "Fetching data...",
                headerTitle: "Notification Center",
                headerSub: "Latest news and alerts",
                updatesTitle: "Latest Updates",
                closeBtnText: "OK, Close Window",
                news: [
                    { icon: "fa-rocket", iconColor: "", tag: "New - v13.7", tagClass: "success", title: "Faster Performance", desc: "Server connection algorithm optimized for 40% faster response, giving you priority on orders." },
                    { icon: "fa-server", iconColor: "color: #d32f2f;", tag: "Server Alert", tagClass: "alert", title: "Scheduled Maintenance", desc: "Brief database maintenance this Friday at dawn lasting approx 10 minutes." },
                    { icon: "fa-music", iconColor: "", tag: "Feature Added", tagClass: "", title: "Pro Ringtones", desc: "You can now easily customize your order ringtone with professional audio via settings." }
                ]
            }
        };

        function setLanguage() {
            // اكتشاف اللغة (تحقق إذا كانت تبدأ بـ ar)
            const isArabic = navigator.language.toLowerCase().startsWith('ar');
            const langKey = isArabic ? 'ar' : 'en';
            const data = newsData[langKey];

            // إعداد اتجاه الصفحة
            document.documentElement.lang = langKey;
            document.documentElement.dir = isArabic ? 'rtl' : 'ltr';

            // تعبئة النصوص الثابتة
            document.getElementById('loadingText').innerText = data.loading;
            document.getElementById('headerTitle').innerText = data.headerTitle;
            document.getElementById('headerSub').innerText = data.headerSub;
            document.getElementById('updatesTitle').innerText = data.updatesTitle;
            document.getElementById('closeBtnText').innerText = data.closeBtnText;

            // تعبئة قائمة الأخبار
            const listEl = document.getElementById('newsList');
            listEl.innerHTML = ''; // تفريغ القائمة
            
            data.news.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <i class="fas ${item.icon} cl-icon" style="${item.iconColor}"></i>
                    <div class="cl-content">
                        <span class="cl-tag ${item.tagClass}">${item.tag}</span>
                        <div class="cl-title">${item.title}</div>
                        <div class="cl-desc">${item.desc}</div>
                    </div>
                `;
                listEl.appendChild(li);
            });
        }

        window.addEventListener('load', () => {
            // 1. تحديد اللغة فور تحميل الصفحة
            setLanguage();

            // 2. محاكاة وقت اتصال بالسيرفر (مثلاً 800 ملي ثانية) ثم إظهار المحتوى بنعومة
            setTimeout(() => {
                document.getElementById('mainCard').classList.add('content-ready');
            }, 800);
        });

        // أمر الإغلاق للـ Android
        function closeDialog() {
            window.location.href = "ninja://close";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>مركز الإشعارات</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap');
        
        * { 
            box-sizing: border-box; margin: 0; padding: 0; 
            -webkit-tap-highlight-color: transparent; outline: 0; 
            -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
        }
        
        body { 
            font-family: 'Tajawal', system-ui, sans-serif; 
            background-color: transparent !important; 
            padding: 16px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .card { 
            position: relative;
            background: #fff; border: 1px solid #e4ddd4; border-radius: 32px; 
            padding: 65px 25px 25px; 
            width: 100%; max-width: 360px; 
            height: 480px; 
            margin: 0 auto; 
            box-shadow: 0 15px 35px rgba(125,107,82,.15);
            display: flex; flex-direction: column; 
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .lang-toggle {
            position: absolute; top: 20px; left: 20px; 
            background: #fff; border: 1px solid #f0ece4; color: #1d1b20; 
            padding: 8px 16px; border-radius: 30px; font-size: 13px; font-weight: 700; 
            font-family: inherit; cursor: pointer; display: flex; align-items: center; gap: 8px; 
            box-shadow: 0 4px 12px rgba(0,0,0,.04); transition: transform .2s; direction: ltr; z-index: 20;
        }
        .lang-toggle:active { transform: scale(.95); }
        html[dir="ltr"] .lang-toggle { right: 20px; left: auto; }
        #globeIcon { color: #7d6b52; transition: transform .6s ease; }

        .content-transition {
            display: flex; flex-direction: column; height: 100%;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .hide-content { opacity: 0; transform: translateY(5px); }

        .update-box-wrap { display: flex; align-items: center; justify-content: flex-start; margin-bottom: 20px; flex-shrink: 0; }
        .brand-badge { 
            width: 55px; height: 55px; background: #fff; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            margin-left: 15px; border: 1px solid rgba(184,147,90,.15); 
            box-shadow: 0 4px 10px rgba(184,147,90,.1); flex-shrink: 0;
            animation: floatingIcon 4s ease-in-out infinite;
        }
        html[dir="ltr"] .brand-badge { margin-left: 0; margin-right: 15px; }
        .brand-badge i { color: #b8935a; font-size: 22px; }
        .update-txt-area { flex: 1; text-align: start; }
        .u-title-clean { font-size: 20px; font-weight: 800; color: #1d1b20; margin-bottom: 2px; letter-spacing: -0.5px; }
        .u-sub-clean { font-size: 11.5px; color: #7d6b52; font-weight: 600; line-height: 1.5; }

        .changelog-container { 
            background: #faf9f7; border: 1px solid #f0ece4; border-radius: 16px; 
            padding: 16px; text-align: start; display: flex; flex-direction: column;
            flex-grow: 1; overflow: hidden; margin-bottom: 15px;
        }
        .changelog-title { 
            font-size: 12px; font-weight: 800; color: #1d1b20; margin-bottom: 15px; 
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        .changelog-title i { color: #b8935a; font-size: 14px; }

        .changelog-list { 
            list-style: none; display: flex; flex-direction: column; gap: 14px; 
            overflow-y: auto; padding-left: 5px; flex-grow: 1;
        }
        html[dir="ltr"] .changelog-list { padding-left: 0; padding-right: 5px; }
        .changelog-list::-webkit-scrollbar { width: 4px; }
        .changelog-list::-webkit-scrollbar-thumb { background: #e4ddd4; border-radius: 10px; }
        
        .changelog-list li { 
            display: flex; align-items: flex-start; gap: 10px; 
            opacity: 0; transform: translateX(10px); 
            animation: slideInRight 0.5s cubic-bezier(0.2, 1, 0.3, 1) forwards; 
        }
        html[dir="ltr"] .changelog-list li { transform: translateX(-10px); animation-name: slideInLeft; }

        @keyframes slideInRight { to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInLeft { to { opacity: 1; transform: translateX(0); } }

        .cl-icon { color: #b8935a; font-size: 15px; margin-top: 2px; animation: floatingIcon 3s ease-in-out infinite; }
        .cl-content { display: flex; flex-direction: column; }
        .cl-title { font-size: 13.5px; font-weight: 800; color: #1d1b20; margin-bottom: 4px; line-height: 1.4; }
        .cl-desc { font-size: 11.5px; color: #4a453f; font-weight: 600; line-height: 1.6; }

        .bottom-actions {
            display: flex; gap: 10px; flex-shrink: 0; z-index: 1; width: 100%;
        }

        .btn-close-modern {
            position: relative; background: #1d1b20; color: #fff; border-radius: 16px; font-weight: 700; 
            height: 50px; border: 1px solid rgba(184,147,90,.5); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; justify-content: center; align-items: center; 
            flex: 1; cursor: pointer; font-family: inherit; font-size: 15px;
            box-shadow: 0 4px 15px rgba(29,27,32,.15);
        }
        .btn-close-modern:hover { border-color: rgba(184,147,90,.9); }
        .btn-close-modern:active { transform: scale(0.96); }

        .btn-feedback-modern {
            background: #fff; color: #b8935a; border-radius: 16px; font-weight: 700; 
            height: 50px; border: 1px solid #e4ddd4; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            display: flex; justify-content: center; align-items: center; gap: 6px;
            flex: 1; cursor: pointer; font-family: inherit; font-size: 14px;
            box-shadow: 0 4px 12px rgba(0,0,0,.03);
        }
        .btn-feedback-modern:hover { border-color: #b8935a; background: #faf9f7; }
        .btn-feedback-modern:active { transform: scale(0.96); }

        .feedback-modal {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.98); z-index: 30;
            border-radius: 32px; display: flex; flex-direction: column;
            padding: 65px 25px 25px; opacity: 0; pointer-events: none;
            transform: translateY(20px); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .feedback-modal.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .fm-title { font-size: 18px; font-weight: 800; color: #1d1b20; margin-bottom: 15px; text-align: center; }
        .feedback-textarea {
            width: 100%; flex-grow: 1; border: 1px solid #e4ddd4; border-radius: 16px;
            padding: 15px; font-family: inherit; font-size: 13px; resize: none;
            margin-bottom: 15px; background: #faf9f7; color: #1d1b20;
            -webkit-user-select: text; user-select: text;
        }
        .feedback-textarea:focus { border-color: #b8935a; background: #fff; }
        .fm-actions { display: flex; gap: 10px; flex-shrink: 0; }
        .btn-send { flex: 2; background: #b8935a; color: #fff; border: none; border-radius: 14px; height: 45px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
        .btn-cancel { flex: 1; background: #f0ece4; color: #1d1b20; border: none; border-radius: 14px; height: 45px; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
        .btn-send:active, .btn-cancel:active { opacity: 0.7; transform: scale(0.96); }

        @keyframes floatingIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
    </style>
</head>
<body>

    <div class="card">
        <button class="lang-toggle" id="langBtn">
            <i class="fas fa-globe" id="globeIcon"></i> 
            <span id="langText" style="margin-top: 2px;">English</span>
        </button>

        <div id="contentTransition" class="content-transition">
            <div class="update-box-wrap">
                <div class="brand-badge"><i class="far fa-newspaper"></i></div>
                <div class="update-txt-area">
                    <h3 class="u-title-clean" id="mTitle">مركز الإشعارات</h3>
                    <p class="u-sub-clean" id="mSub">تابع أحدث الأخبار والتنبيهات</p>
                </div>
            </div>

            <div class="changelog-container">
                <div class="changelog-title"><i class="fas fa-bolt"></i> <span id="uTitle">آخر الأخبار</span></div>
                <ul class="changelog-list">
                    <li>
                        <i class="fas fa-check-circle cl-icon"></i>
                        <div class="cl-content">
                            <div class="cl-title" id="cTitle">أداء أسرع واستقرار أعلى</div>
                            <div class="cl-desc" id="cDesc">تم تحسين خوارزمية الاتصال بالسيرفر لضمان استجابة أسرع بنسبة 40% للحصول على أولوية في الطلبات.</div>
                        </div>
                    </li>
                </ul>
            </div>

            <div class="bottom-actions">
                <button class="btn-feedback-modern" id="openFeedbackBtn">
                    <i class="fas fa-comment-dots"></i>
                    <span id="feedbackBtnText">اقتراحات</span>
                </button>
                <button class="btn-close-modern" id="closeBtn">
                    <span id="btnText">حسناً</span>
                </button>
            </div>
        </div>

        <div class="feedback-modal" id="feedbackModal">
            <h3 class="fm-title" id="fmTitle">شاركنا رأيك</h3>
            <textarea class="feedback-textarea" id="feedbackText" placeholder="اكتب اقتراحك أو مشكلتك هنا..."></textarea>
            <div class="fm-actions">
                <button class="btn-send" id="sendBtn">إرسال</button>
                <button class="btn-cancel" id="cancelBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.getElementById('closeBtn').addEventListener('click', function() {
            window.location.href = "ninja://close";
        });

        const WEBHOOK_URL = "https://hook.us2.make.com/1iqt96vrxj7v46elx4sbb0rmfv2fx12g";

        const LANG_DICT = {
            ar: {
                dir: 'rtl', opp: 'en', langT: 'English',
                title: 'مركز الإشعارات', sub: 'تابع أحدث الأخبار والتنبيهات', upTitle: 'آخر الأخبار', btn: 'حسناً',
                fBtnText: 'اقتراحات',
                cTit: 'إطلاق الإصدار الجديد v13.7',
                cDes: 'أصبحت خريطة الموقع تدعم الآن نظام "النقاط الحرارية"، لتسهيل اختيار موقعك بالقرب من المطاعم ذات الطلب العالي.',
                fmTitle: 'شاركنا رأيك', fmPlace: 'اكتب اقتراحك أو مشكلتك هنا...', fmSend: 'إرسال', fmCancel: 'إلغاء',
                fmSuccess: 'تم الإرسال بنجاح، شكراً لك!'
            },
            en: {
                dir: 'ltr', opp: 'ar', langT: 'العربية',
                title: 'Notification Center', sub: 'Follow the latest news and alerts', upTitle: 'Latest News', btn: 'OK',
                fBtnText: 'Feedback',
                cTit: 'Version v13.7 Released',
                cDes: 'The location map now supports a "Heatmap" system, making it easier to select your location.',
                fmTitle: 'Share your feedback', fmPlace: 'Write your suggestion or issue here...', fmSend: 'Send', fmCancel: 'Cancel',
                fmSuccess: 'Sent successfully, Thank you!'
            }
        };

        let currentLang = 'ar';
        try {
            let savedLang = localStorage.getItem('ninjaNewsLangV2');
            currentLang = savedLang ? savedLang : ((navigator.language || '').toLowerCase().startsWith('en') ? 'en' : 'ar');
        } catch (e) { currentLang = 'ar'; }

        function applyLanguage() {
            const d = LANG_DICT[currentLang];
            document.documentElement.lang = currentLang;
            document.documentElement.dir = d.dir;
            document.getElementById('langText').innerText = d.langT;
            document.getElementById('mTitle').innerText = d.title;
            document.getElementById('mSub').innerText = d.sub;
            document.getElementById('uTitle').innerText = d.upTitle;
            document.getElementById('btnText').innerText = d.btn;
            document.getElementById('feedbackBtnText').innerText = d.fBtnText;
            document.getElementById('cTitle').innerText = d.cTit;
            document.getElementById('cDesc').innerText = d.cDes;
            
            document.getElementById('fmTitle').innerText = d.fmTitle;
            document.getElementById('feedbackText').placeholder = d.fmPlace;
            document.getElementById('sendBtn').innerText = d.fmSend;
            document.getElementById('cancelBtn').innerText = d.fmCancel;
        }

        document.getElementById('langBtn').addEventListener('click', function() {
            currentLang = LANG_DICT[currentLang].opp;
            try { localStorage.setItem('ninjaNewsLangV2', currentLang); } catch (e) {}
            
            let globe = document.getElementById('globeIcon');
            globe.style.transform = globe.style.transform === 'rotate(360deg)' ? 'rotate(0deg)' : 'rotate(360deg)';
            
            let content = document.getElementById('contentTransition');
            content.classList.add('hide-content');
            setTimeout(() => { applyLanguage(); content.classList.remove('hide-content'); }, 300);
        });

        const feedbackModal = document.getElementById('feedbackModal');
        const feedbackText = document.getElementById('feedbackText');

        document.getElementById('openFeedbackBtn').addEventListener('click', () => {
            feedbackModal.classList.add('active');
            feedbackText.value = '';
            feedbackText.focus();
        });

        document.getElementById('cancelBtn').addEventListener('click', () => {
            feedbackModal.classList.remove('active');
        });

        document.getElementById('sendBtn').addEventListener('click', () => {
            const text = feedbackText.value.trim();
            if(!text) return;
            
            const btn = document.getElementById('sendBtn');
            const originalText = btn.innerText;
            btn.innerText = '...';
            btn.disabled = true;

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ suggestion: text, language: currentLang })
            }).then(() => {
                alert(LANG_DICT[currentLang].fmSuccess);
                feedbackModal.classList.remove('active');
            }).catch(() => {
                alert(LANG_DICT[currentLang].fmSuccess);
                feedbackModal.classList.remove('active');
            }).finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        });

        applyLanguage();
    </script>
</body>
</html>
